name: Cross-Repo Governance Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  actions: read

jobs:
  cross-repo-pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enumerate governance PRs in stabilisation-demo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          gh pr list \
            --repo vitrixLab/stabilisation-demo \
            --state open \
            --limit 100 \
            --json number,title,state,isDraft,mergeable,baseRefName,headRefName,headRefOid,changedFiles,url

      - name: L0 per-PR preflight for stabilisation-demo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo vitrixLab/stabilisation-demo \
            --state open \
            --limit 100 \
            --json number,title,state,isDraft,mergeable,baseRefName,headRefName,headRefOid,changedFiles,url \
            --jq '.[]' > /tmp/prs.json

          echo "=== L0 PREFLIGHT SUMMARY ==="

          jq -r '
            .[] |
            [
              (.number|tostring),
              .state,
              (.isDraft|tostring),
              (.mergeable|tostring),
              .baseRefName,
              .headRefName,
              (.changedFiles|tostring),
              .url
            ] | @tsv
          ' /tmp/prs.json

name: Cross-Repo Governance Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  actions: read

jobs:
  cross-repo-pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enumerate governance PRs in stabilisation-demo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          gh pr list \
            --repo vitrixLab/stabilisation-demo \
            --state open \
            --limit 50 \
            --json number,title,state,isDraft,headRefName,headRefOid,url

      - name: Governance report
        run: |
          echo "Cross-repo PR governance report completed."
